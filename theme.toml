# theme.toml template for a Hugo theme
# See https://github.com/spf13/hugoThemes#themetoml for an example

name = "Nix - Dark Mode"
license = "MIT"
licenselink = "https://github.com/LordMathis/hugo-theme-nix/blob/master/LICENSE.md"
description = "Simple theme for Hugo"
homepage = "https://github.com/EddMCambs/hugo-theme-nix/"
tags = ["simple", "minimal", "unix", "terminal", "blog", "multilingual"]
features = ["blog"]
min_version = 0.20

[author]
  name = "Edd Miles"
  homepage = "https://i.am.eddmil.es"

[original]
  author = "Matúš Námešný"
  homepage = "https://namesny.com"
  repo = "https://github.com/LordMathis/hugo-theme-nix/"
